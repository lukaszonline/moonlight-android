name: Build Moonlight with keyboard button

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
          fetch-depth: 0

      - name: Apply upstream PR 1583
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/moonlight-stream/moonlight-android.git
          git fetch upstream pull/1583/head:pr-1583
          git cherry-pick pr-1583

      - name: Replace keyboard button icon
        run: |
          cat > app/src/main/res/drawable/ic_keyboard.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M20,5H4C2.9,5 2,5.9 2,7v10c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V7c0,-1.1 -0.9,-2 -2,-2zM5,8h2v2H5V8zM8,8h2v2H8V8zM11,8h2v2h-2V8zM14,8h2v2h-2V8zM17,8h2v2h-2V8zM5,11h2v2H5v-2zM8,11h2v2H8v-2zM11,11h2v2h-2v-2zM14,11h2v2h-2v-2zM17,11h2v2h-2v-2zM7,14h10v2H7v-2z" />
          </vector>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: moonlight-keyboard-button-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
          if-no-files-found: error
